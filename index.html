        // --- WEB AUDIO API SOUND SYSTEM ---
        let audioCtx = null;
        let soundEnabled = true;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            if (!soundEnabled) return;
            initAudio();
            if (!audioCtx) return;

            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'click') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.08);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
                osc.start(now);
                osc.stop(now + 0.08);
            } else if (type === 'correct') {
                // Happy chord chime (C5 - E5 - G5 - C6)
                const freqs = [523.25, 659.25, 783.99, 1046.50];
                freqs.forEach((freq, idx) => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.type = 'triangle';
                    o.frequency.value = freq;
                    o.connect(g);
                    g.connect(audioCtx.destination);
                    const startTime = now + idx * 0.07;
                    g.gain.setValueAtTime(0.15, startTime);
                    g.gain.exponentialRampToValueAtTime(0.001, startTime + 0.35);
                    o.start(startTime);
                    o.stop(startTime + 0.35);
                });
            } else if (type === 'wrong') {
                // Soft low note drop
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(280, now);
                osc.frequency.exponentialRampToValueAtTime(140, now + 0.25);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
                osc.start(now);
                osc.stop(now + 0.25);
            } else if (type === 'victory') {
                // Fanfare notes
                const notes = [440, 554.37, 659.25, 880];
                notes.forEach((freq, idx) => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.type = 'sine';
                    o.frequency.value = freq;
                    o.connect(g);
                    g.connect(audioCtx.destination);
                    const startTime = now + idx * 0.1;
                    g.gain.setValueAtTime(0.2, startTime);
                    g.gain.exponentialRampToValueAtTime(0.001, startTime + 0.4);
                    o.start(startTime);
                    o.stop(startTime + 0.4);
                });
            }
        }

                                        <!-- Cloud Layer 3 (Soft Blue Inner) -->
                                        <path id="cloud-l3" d="M 50 70 Q 70 40 100 60 Q 130 40 150 70 Z" fill="#93C5FD"/>
                                        <!-- Inner Highlight -->
                                        <path d="M 70 68 Q 85 50 100 62 Q 115 50 130 68 Z" fill="#FFFFFF"/>
                                    </svg>
                                </div>

                                <div class="mt-3 flex items-center space-x-2 w-full max-w-xs">
                                    <span class="text-[11px] font-bold text-slate-500">Gradasi Warna:</span>
                                    <button onclick="shiftMegaMendungColors()" class="btn-pill bg-tosca text-white px-3 py-1 rounded-full text-xs font-bold w-full">Ganti Palet Warna Awan</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    `;
                    break;

                // SLIDE 9: MATERI 5 - BATIK TRUNTUM
                case 9:
                    html = `
                    <div class="flex-1 flex flex-col p-6 bg-slate-50">
                        <div class="flex justify-between items-center mb-3">
                            <span class="bg-butter-dark text-white font-extrabold text-xs px-3 py-1 rounded-full">MATERI 5 DARI 5</span>
                            <div class="flex space-x-2">
                                <button onclick="goToSlide(8)" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-1 rounded-full text-xs font-bold">KEMBALI</button>
                                <button onclick="goToSlide(10)" class="bg-butter-dark text-white px-4 py-1 rounded-full text-xs font-bold">MENU KUIS <i class="fa-solid fa-gamepad ml-1"></i></button>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 my-auto max-w-5xl mx-auto w-full items-center">
                            <!-- Explanation Left -->
                            <div class="space-y-3">
                                <span class="bg-butter text-darkslate text-[10px] font-bold px-2.5 py-0.5 rounded-full">Pola & Ritme Keseimbangan</span>
                                <h2 class="font-heading text-2xl sm:text-3xl font-extrabold text-darkslate">Motif Batik Truntum</h2>
                                <p class="text-xs sm:text-sm text-slate-600 leading-relaxed">
                                    Batik Truntum menggambarkan keindahan taburan <strong class="text-butter-dark font-bold">bintang-bintang kecil di malam hari</strong> yang bersemi kembali.
                                </p>
                                <p class="text-xs text-slate-500 leading-relaxed">
                                    Pengulangan motif bunga bintang berukuran kecil yang tersebar rapat dan seimbang menciptakan suasana ritme visual yang tenang, harmonis, dan tulus.
                                </p>
                            </div>

                            <!-- Interactive SVG Batik Truntum Viewer -->
                            <div class="bg-white border-2 border-butter-dark/30 rounded-3xl p-4 shadow-md flex flex-col items-center">
                                <div class="w-full max-w-[260px] aspect-square bg-darkslate rounded-2xl p-3 flex items-center justify-center relative overflow-hidden">
                                    <svg viewBox="0 0 100 100" class="w-full h-full">
                                        <!-- Grid of small truntum stars -->
                                        <g fill="#FFF59D" stroke="#E5A93C" stroke-width="0.5">
                                            <!-- Row 1 -->
                                            <path d="M 20 20 L 22 15 L 24 20 L 29 22 L 24 24 L 22 29 L 20 24 L 15 22 Z"/>
                                            <path d="M 50 20 L 52 15 L 54 20 L 59 22 L 54 24 L 52 29 L 50 24 L 45 22 Z"/>
                                            <path d="M 80 20 L 82 15 L 84 20 L 89 22 L 84 24 L 82 29 L 80 24 L 75 22 Z"/>
                                            <!-- Row 2 -->
                                            <path d="M 35 50 L 37 45 L 39 50 L 44 52 L 39 54 L 37 59 L 35 54 L 30 52 Z"/>
                                            <path d="M 65 50 L 67 45 L 69 50 L 74 52 L 69 54 L 67 59 L 65 54 L 60 52 Z"/>
                                            <!-- Row 3 -->
                                            <path d="M 20 80 L 22 75 L 24 80 L 29 82 L 24 84 L 22 89 L 20 84 L 15 82 Z"/>
                                            <path d="M 50 80 L 52 75 L 54 80 L 59 82 L 54 84 L 52 89 L 50 84 L 45 82 Z"/>
                                            <path d="M 80 80 L 82 75 L 84 80 L 89 82 L 84 84 L 82 89 L 80 84 L 75 82 Z"/>
                                        </g>
                                    </svg>
                                </div>
                                <p class="text-[11px] text-slate-500 mt-2 font-semibold">Pengulangan Motif Bintang Rapat & Harmonism</p>
                            </div>
                        </div>
                    </div>
                    `;
                    break;

                // QUIZ SLIDES SYSTEM (SLIDES 10 to 24)
                default:
                    if (slideNum >= 10 && slideNum <= 24) {
                        html = renderQuizBranchSlide(slideNum);
                    } else if (slideNum === 25) {
                        html = renderCompletionSlide();
                    }
                    break;
            }

            viewport.innerHTML = html;
            currentSlide = slideNum;
            updateNavButtonsState();
        }

        // Render branching logic for Quiz slides (Question -> Correct Resp / Wrong Resp)
        function renderQuizBranchSlide(slideNum) {
            // Map slide numbers:
            // Q1: 10 (Question), 11 (Correct), 12 (Wrong)
            // Q2: 13 (Question), 14 (Correct), 15 (Wrong)
            // Q3: 16 (Question), 17 (Correct), 18 (Wrong)
            // Q4: 19 (Question), 20 (Correct), 21 (Wrong)
            // Q5: 22 (Question), 23 (Correct), 24 (Wrong)
            
            const qIndex = Math.floor((slideNum - 10) / 3);
            const subType = (slideNum - 10) % 3; // 0 = Question, 1 = Correct, 2 = Wrong
            const qData = quizData[qIndex];

            // 1. QUESTION SCREEN (subType === 0)
            if (subType === 0) {
                return `
                <div class="flex-1 flex flex-col p-6 bg-slate-50">
                    <div class="flex justify-between items-center mb-4">
                        <span class="bg-butter text-darkslate font-extrabold text-xs px-3.5 py-1 rounded-full shadow-sm">
                            SOAL EVALUASI ${qIndex + 1} DARI 5
                        </span>
                        <span class="text-xs font-bold text-slate-400">Skor Real-Time: ${userScore} Pts</span>
                    </div>

                    <div class="max-w-3xl mx-auto my-auto w-full bg-white border-2 border-lavender/30 rounded-3xl p-6 shadow-md space-y-5">
                        <div class="space-y-2">
                            <span class="text-[10px] font-extrabold text-lavender uppercase tracking-wider">Pertanyaan ${qIndex + 1}</span>
                            <h3 class="font-heading font-bold text-base sm:text-lg text-darkslate leading-snug">
                                ${qData.question}
                            </h3>
                        </div>

                        <!-- Options List -->
                        <div class="space-y-3">
                            ${qData.options.map(opt => `
                                <button onclick="selectQuizAnswer(${qIndex}, '${opt.key}', ${opt.correct})" class="btn-pill w-full bg-slate-50 hover:bg-lavender-soft border-2 border-slate-200 hover:border-lavender p-3.5 rounded-2xl flex items-center justify-between text-left transition group">
                                    <div class="flex items-center space-x-3">
                                        <div class="w-8 h-8 rounded-xl bg-slate-200 group-hover:bg-lavender group-hover:text-white font-extrabold text-xs flex items-center justify-center transition">
                                            ${opt.key}
                                        </div>
                                        <span class="text-xs sm:text-sm font-semibold text-slate-700 group-hover:text-darkslate">${opt.text}</span>
                                    </div>
                                    <i class="fa-solid fa-chevron-right text-slate-300 group-hover:text-lavender transition"></i>
                                </button>
                            `).join('')}
                        </div>
                    </div>
                </div>
                `;
            }

            // 2. CORRECT RESPONSE SCREEN (subType === 1)
            else if (subType === 1) {
                const nextSlideTarget = (qIndex < 4) ? (10 + (qIndex + 1) * 3) : 25;
                return `
                <div class="flex-1 flex flex-col p-6 bg-emerald-50/60">
                    <div class="max-w-2xl mx-auto my-auto w-full bg-white border-2 border-emerald-300 rounded-3xl p-6 shadow-lg text-center space-y-4">
                        <div class="w-16 h-16 rounded-full bg-emerald-100 text-emerald-500 flex items-center justify-center text-3xl mx-auto shadow-inner">
                            <i class="fa-solid fa-circle-check"></i>
                        </div>
                        <h2 class="font-heading text-2xl font-black text-emerald-700">HEBAT! JAWABANMU BENAR!</h2>
                        <div class="bg-emerald-50 p-4 rounded-2xl border border-emerald-200 text-left space-y-1">
                            <p class="text-xs font-bold text-emerald-800">Penjelasan Pembelajaran:</p>
                            <p class="text-xs text-emerald-950 leading-relaxed">${qData.explanation}</p>
                        </div>
                        <div class="pt-2">
                            <button onclick="goToSlide(${nextSlideTarget})" class="btn-pill bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-8 py-3 rounded-full text-xs shadow-md">
                                ${qIndex < 4 ? 'LANJUT KE SOAL BERIKUTNYA <i class="fa-solid fa-arrow-right ml-1"></i>' : 'LIHAT HASIL PENYELESAIAN <i class="fa-solid fa-trophy ml-1"></i>'}
                            </button>
                        </div>
                    </div>
                </div>
                `;
            }

            // 3. WRONG RESPONSE SCREEN (subType === 2)
            else if (subType === 2) {
                const questionSlideTarget = 10 + qIndex * 3;
                return `
                <div class="flex-1 flex flex-col p-6 bg-rose-50/60">
                    <div class="max-w-2xl mx-auto my-auto w-full bg-white border-2 border-rose-300 rounded-3xl p-6 shadow-lg text-center space-y-4">
                        <div class="w-16 h-16 rounded-full bg-rose-100 text-rose-500 flex items-center justify-center text-3xl mx-auto shadow-inner">
                            <i class="fa-solid fa-circle-xmark"></i>
                        </div>
                        <h2 class="font-heading text-xl font-black text-rose-700">HAMPIR TEPAT! YUK COBA LAGI</h2>
                        <div class="bg-rose-50 p-4 rounded-2xl border border-rose-200 text-left space-y-1">
                            <p class="text-xs font-bold text-rose-800"><i class="fa-solid fa-lightbulb text-butter-dark mr-1"></i> Petunjuk Evaluasi:</p>
                            <p class="text-xs text-rose-950 leading-relaxed">${qData.hint}</p>
                        </div>
                        <div class="pt-2 flex justify-center space-x-3">
                            <button onclick="goToSlide(${questionSlideTarget})" class="btn-pill bg-rose-500 hover:bg-rose-600 text-white font-bold px-6 py-2.5 rounded-full text-xs shadow-md">
                                <i class="fa-solid fa-rotate-left mr-1"></i> COBA LAGI SOAL INI
                            </button>
                            <button onclick="goToSlide(${qData.materialSlide})" class="btn-pill bg-slate-700 hover:bg-slate-800 text-white font-bold px-6 py-2.5 rounded-full text-xs shadow-md">
                                <i class="fa-solid fa-book-open mr-1"></i> PELAJARI MATERI
                            </button>
                        </div>
                    </div>
                </div>
                `;
            }
        }

        // Handle answer click in Quiz
        function selectQuizAnswer(qIndex, optionKey, isCorrect) {
            quizAnswers[qIndex] = optionKey;
            
            if (isCorrect) {
                if (!answeredQuestions[qIndex]) {
                    userScore += 20; // 20 points per question
                    answeredQuestions[qIndex] = true;
                }
                playSound('correct');
                goToSlide(10 + qIndex * 3 + 1); // Go to Correct Screen
            } else {
                playSound('wrong');
                goToSlide(10 + qIndex * 3 + 2); // Go to Wrong Screen
            }
        }

        // SLIDE 25: HALAMAN PENYELESAIAN & HASH KELAYAKAN
        function renderCompletionSlide() {
            playSound('victory');
            const stars = userScore >= 80 ? 3 : userScore >= 60 ? 2 : 1;
            
            return `
            <div class="flex-1 flex flex-col p-6 bg-gradient-to-br from-lavender-soft via-white to-tosca-light relative overflow-hidden">
                <div class="max-w-2xl mx-auto my-auto w-full bg-white/95 border-2 border-lavender/40 rounded-3xl p-6 shadow-xl text-center space-y-4 backdrop-blur-md">
                    
                    <div class="inline-block bg-butter text-darkslate text-xs font-black px-4 py-1 rounded-full uppercase tracking-wider border border-butter-dark/30">
                        PENCAPAIAN PEMBELAJARAN
                    </div>

                    <h2 class="font-heading text-3xl font-black text-darkslate">SELAMAT! KAMU BERHASIL!</h2>
                    <p class="text-xs text-slate-500">Telah menyelesaikan Media Pembelajaran Interaktif Pola & Ritme Batik Nusantara</p>

                    <!-- Star Rating Display -->
                    <div class="flex justify-center space-x-2 text-3xl text-butter-dark">
                        ${[1, 2, 3].map(i => `<i class="fa-solid fa-star ${i <= stars ? 'text-amber-400 drop-shadow-md' : 'text-slate-200'}"></i>`).join('')}
                    </div>

                    <!-- Final Score Box -->
                    <div class="bg-lavender-soft p-4 rounded-2xl border border-lavender/30 max-w-xs mx-auto">
                        <span class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">SKOR AKHIR EVALUASI</span>
                        <div class="text-4xl font-heading font-black text-lavender-dark my-1">${userScore} <span class="text-sm font-bold text-slate-400">/ 100</span></div>
                        <p class="text-[11px] text-slate-600 font-semibold">SD Negeri Gegunung Kulon • Kelas 5</p>
                    </div>

                    <!-- Action Buttons -->
                    <div class="pt-3 flex justify-center space-x-3">
                        <button onclick="resetQuizAndReplay()" class="btn-pill bg-lavender hover:bg-lavender-dark text-white font-bold px-6 py-2.5 rounded-full text-xs shadow-md flex items-center space-x-2">
                            <i class="fa-solid fa-rotate"></i>
                            <span>ULANGI KUIS</span>
                        </button>
                        <button onclick="goToSlide(2)" class="btn-pill bg-tosca hover:bg-tosca-dark text-white font-bold px-6 py-2.5 rounded-full text-xs shadow-md flex items-center space-x-2">
                            <i class="fa-solid fa-house"></i>
                            <span>MENU UTAMA</span>
                        </button>
                    </div>

                </div>
            </div>
            `;
        }

        function resetQuizAndReplay() {
            userScore = 0;
            answeredQuestions = [false, false, false, false, false];
            quizAnswers = [null, null, null, null, null];
            goToSlide(10);
        }

        // SLIDE NAVIGATION CONTROLLER
        function goToSlide(n) {
            if (n < 1) n = 1;
            if (n > totalSlides) n = totalSlides;
            playSound('click');
            renderSlide(n);
        }

        function nextSlide() {
            if (currentSlide < totalSlides) goToSlide(currentSlide + 1);
        }

        function prevSlide() {
            if (currentSlide > 1) goToSlide(currentSlide - 1);
        }

        function updateNavButtonsState() {
            const btnPrev = document.getElementById('btn-prev');
            const btnNext = document.getElementById('btn-next');
            if (btnPrev) btnPrev.style.opacity = currentSlide === 1 ? '0.4' : '1';
            if (btnNext) btnNext.style.opacity = currentSlide === totalSlides ? '0.4' : '1';
        }

        // --- INTERACTIVE SIMULATION LOGIC ---

        // 1. Video Simulation Canvas
        let vidSimAnimId = null;
        let vidSimPlaying = false;
        let vidSimTime = 0;

        function initVideoSim() {
            const canvas = document.getElementById('video-sim-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            canvas.width = 480;
            canvas.height = 270;

            function drawFrame() {
                ctx.fillStyle = '#0f172a';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Draw moving batik patterns
                ctx.strokeStyle = '#8A70D6';
                ctx.lineWidth = 3;

                const waveOffset = vidSimTime * 40;
                ctx.beginPath();
                for (let x = 0; x < canvas.width; x += 10) {
                    const y = 135 + Math.sin((x + waveOffset) * 0.03) * 35;
                    if (x === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();

                // Draw pulsing geometric circles
                for (let i = 0; i < 4; i++) {
                    const cx = 100 + i * 90;
                    const radius = 20 + Math.sin(vidSimTime * 2 + i) * 6;
                    ctx.beginPath();
                    ctx.arc(cx, 80, radius, 0, Math.PI * 2);
                    ctx.fillStyle = i % 2 === 0 ? '#4ECDC4' : '#FF8B94';
                    ctx.fill();
                }

                if (vidSimPlaying) {
                    vidSimTime += 0.03;
                    if (vidSimTime > 15) vidSimTime = 0;
                    const progPct = (vidSimTime / 15) * 100;
                    const pBar = document.getElementById('vid-progress');
                    if (pBar) pBar.style.width = `${progPct}%`;

                    const tText = document.getElementById('vid-time');
                    if (tText) tText.innerText = `00:${Math.floor(vidSimTime).toString().padStart(2, '0')} / 00:15`;

                    vidSimAnimId = requestAnimationFrame(drawFrame);
                }
            }

            drawFrame();
        }

        function toggleVideoSim() {
            vidSimPlaying = !vidSimPlaying;
            const overlay = document.getElementById('video-play-overlay');
            const icon = document.getElementById('vid-control-icon');

            if (vidSimPlaying) {
                if (overlay) overlay.style.display = 'none';
                if (icon) icon.className = 'fa-solid fa-pause';
                playSound('click');
                initVideoSim();
            } else {
                if (overlay) overlay.style.display = 'flex';
                if (icon) icon.className = 'fa-solid fa-play';
                if (vidSimAnimId) cancelAnimationFrame(vidSimAnimId);
            }
        }

        function scrubVideo(e) {
            const bar = e.currentTarget;
            const rect = bar.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const pct = clickX / rect.width;
            vidSimTime = pct * 15;
            initVideoSim();
        }

        // 2. Pattern Sandbox Logic (Slide 5)
        let currentPatternShape = 'circle';
        let currentPatternColorIdx = 0;
        const patternColors = ['#8A70D6', '#4ECDC4', '#FF8B94', '#FBC02D'];

        function initPatternSandbox() {
            const container = document.getElementById('pattern-container');
            if (!container) return;
            container.innerHTML = '';
            for (let i = 0; i < 12; i++) {
                const box = document.createElement('div');
                box.className = 'w-full aspect-square rounded-xl flex items-center justify-center transition-all duration-300 transform hover:scale-110 cursor-pointer shadow-sm';
                box.style.backgroundColor = patternColors[currentPatternColorIdx];

                if (currentPatternShape === 'circle') {
                    box.style.borderRadius = '9999px';
                } else if (currentPatternShape === 'diamond') {
                    box.style.borderRadius = '4px';
                    box.style.transform = 'rotate(45deg)';
                }
                container.appendChild(box);
            }
        }

        function changePatternStyle(shape) {
            currentPatternShape = shape;
            playSound('click');
            initPatternSandbox();
        }

        function togglePatternColor() {
            currentPatternColorIdx = (currentPatternColorIdx + 1) % patternColors.length;
            playSound('click');
            initPatternSandbox();
        }

        // 3. Rhythm Canvas Logic (Slide 6)
        let rhythmAnimId = null;
        let rhythmSpeed = 2;
        let rhythmTime = 0;

        function initRhythmCanvas() {
            const canvas = document.getElementById('rhythm-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');

            function draw() {
                ctx.fillStyle = '#0f172a';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.lineWidth = 3;
                ctx.strokeStyle = '#4ECDC4';

                ctx.beginPath();
                for (let x = 0; x < canvas.width; x += 5) {
                    const y = 90 + Math.sin((x + rhythmTime * 50) * 0.02) * 30;
                    if (x === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();

                rhythmTime += 0.02 * rhythmSpeed;
                rhythmAnimId = requestAnimationFrame(draw);
            }

            if (rhythmAnimId) cancelAnimationFrame(rhythmAnimId);
            draw();
        }

        function updateRhythmSpeed(val) {
            rhythmSpeed = parseFloat(val);
        }

        // 4. Batik Kawung Interactive Grid Toggle (Slide 7)
        let kawungGridVisible = false;
        function toggleKawungGrid() {
            kawungGridVisible = !kawungGridVisible;
            const grid = document.getElementById('kawung-grid');
            if (grid) {
                grid.style.opacity = kawungGridVisible ? '1' : '0';
                playSound('click');
            }
        }

        // 5. Mega Mendung Color Switcher (Slide 8)
        let megaPaletteIdx = 0;
        const megaPalettes = [
            ['#1E3A8A', '#3B82F6', '#93C5FD'],
            ['#701A75', '#C084FC', '#F0ABFC'],
            ['#065F46', '#34D399', '#A7F3D0']
        ];

        function shiftMegaMendungColors() {
            megaPaletteIdx = (megaPaletteIdx + 1) % megaPalettes.length;
            const pal = megaPalettes[megaPaletteIdx];
            const l1 = document.getElementById('cloud-l1');
            const l2 = document.getElementById('cloud-l2');
            const l3 = document.getElementById('cloud-l3');

            if (l1 && l2 && l3) {
                l1.setAttribute('fill', pal[0]);
                l2.setAttribute('fill', pal[1]);
                l3.setAttribute('fill', pal[2]);
                playSound('click');
            }
        }

        // KEYBOARD SHORTCUTS NAVIGATION
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'PageDown') {
                nextSlide();
            } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                prevSlide();
            } else if (e.key === 'Escape') {
                goToSlide(2); // Return to Menu
            }
        });

        // INIT APP ON LOAD
        window.onload = function() {
            renderSlide(1);
        };
    </script>
</body>
</html>
